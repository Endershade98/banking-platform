services:

  postgres:
    image: postgres:15-alpine
    container_name: banking_postgres
    restart: always

    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: banking_redis
    ports:
      - "6381:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: banking_django

    command: >
      daphne
      -b 0.0.0.0
      -p 8000
      config.asgi:application

    volumes:
      - ../src:/app

    ports:
      - "8001:8000"

    env_file:
      - ../.env

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: